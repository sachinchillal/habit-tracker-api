spring.application.name=habit-tracker

spring.datasource.url=jdbc:mariadb://localhost:3306/habit_tracker
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Local development only. Override app.webhook.secret in any shared environment.
app.webhook.secret=local-dev-webhook-secret